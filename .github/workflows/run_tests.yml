name: API Testing with Pytest

# Настраиваем триггеры: запускать тесты при любом push или pull request в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api-tests:
    # Запускаем виртуальную машину на базе последней версии Ubuntu
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Скачиваем код нашего репозитория на виртуальную машину
    - name: Checkout project code
      uses: actions/checkout@v4

    # Шаг 2: Устанавливаем и настраиваем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # Шаг 3: Устанавливаем библиотеки из файла requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Шаг 4: Запускаем тесты командой pytest
    - name: Run Pytest Automation
      run: |
        pytest -v