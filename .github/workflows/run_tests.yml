name: API Testing with Pytest

# Настраиваем триггеры: запускать тесты при любом push или pull request в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  api-tests:
    # Запускаем виртуальную машину на базе последней версии Ubuntu
    runs-on: ubuntu-latest

    steps:
    # Скачиваем код нашего репозитория на виртуальную машину
    - name: Checkout project code
      uses: actions/checkout@v4

    # Устанавливаем и настраиваем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # Устанавливаем библиотеки из файла requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/requirements.txt

    # Запускаем тесты на Pytest и собираем сырые результаты Allure в папку allure-results
    - name: Run Pytest with Allure
      run: |
        pytest -v --alluredir=allure-results
      continue-on-error: true # Позволяет продолжить пайплайн, даже если тесты упали (а наши DDT-тесты упадут из-за багов!)
    
    # Генерируем красивый HTML-отчет из сырых результатов и публикуем его на GitHub Pages
    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20

    # Деплоим готовый отчет на ветку gh-pages для публичного просмотра
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history